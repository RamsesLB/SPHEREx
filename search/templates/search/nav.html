{% load i18n %}
<header class="site-header">
    <nav class="navbar navbar-expand-lg border-bottom border-subtle-dark py-3" aria-label="SPHEREx" data-bs-theme="dark">
        <div class="container-fluid px-4 px-lg-5">
            <div class="d-flex align-items-center">
                <a class="navbar-brand d-flex align-items-center gap-2 text-white m-0 text-decoration-none" href="{% url 'home' %}">
                    <img class="app-mark" src="/static/favicon.ico" alt="" width="32" height="32">
                    <span class="font-headline fw-bold fs-5 text-white">SPHEREx</span>
                </a>
                <a class="space-apps font-mono-tag d-none d-sm-inline" href="https://www.spaceappschallenge.org/" target="_blank" rel="noopener noreferrer">NASA SPACE APPS 2026</a>
            </div>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="{% trans "Open menu" %}">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse ps-lg-5" id="navbarContent">
                <ul class="navbar-nav gap-lg-4 text-uppercase">
                    <li class="nav-item d-sm-none">
                        <a class="nav-link" href="https://www.spaceappschallenge.org/" target="_blank" rel="noopener noreferrer">NASA Space Apps 2026</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://science.nasa.gov/mission/spherex/" target="_blank" rel="noopener noreferrer">{% trans "Mission" %}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'index' %} active{% endif %}" href="{% url 'index' %}"{% if request.resolver_match.url_name == 'index' %} aria-current="page"{% endif %}>{% trans "Data search" %}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'information' %} active{% endif %}" href="{% url 'information' %}"{% if request.resolver_match.url_name == 'information' %} aria-current="page"{% endif %}>{% trans "Information" %}</a>
                    </li>
                </ul>
                <div class="dropdown ms-lg-auto">
                    <button class="lang-toggle dropdown-toggle text-uppercase" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="{% trans "Language" %}">
                        {% if LANGUAGE_CODE == "es-419" %}Español{% else %}English{% endif %}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form action="{% url 'set_language' %}" method="post">
                                {% csrf_token %}
                                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                                <button class="dropdown-item" name="language" value="en" type="submit">English</button>
                            </form>
                        </li>
                        <li>
                            <form action="{% url 'set_language' %}" method="post">
                                {% csrf_token %}
                                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                                <button class="dropdown-item" name="language" value="es-419" type="submit">Español</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
